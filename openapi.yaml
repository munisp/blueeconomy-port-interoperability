      required: [request_id, declaration_ref, declaration_type, hs_code, goods_description, country_of_origin, port_of_entry, gross_weight_kg, net_weight_kg, number_of_packages, consignee_id, operator_id, invoice_amount_minor, invoice_currency, tariff_bps, vat_bps]
