# blueeconomy-port-interoperability HTTP API.
#
# Coverage note: this document currently describes the mobile push-token
# surface only (added with the /v1/push-tokens implementation). The wider
# route surface (port calls, bookings, queue, declarations, secure chain,
# vessel ops) predates this document and is documented route-by-route as it
# is touched.
openapi: 3.0.3
info:
  title: blueeconomy-port-interoperability
  version: 0.1.0
  description: >-
    NSW/port-community interoperability API. All /v1 routes require the
    tenant gateway Bearer token (HS256 shared-key or RS256 Keycloak JWKS
    profile); the verified token subject is the actor identity for every
    write.
servers:
  - url: /

paths:
  /v1/push-tokens:
    post:
      summary: Register or refresh a mobile push-notification device token
      description: >-
        Upserts the caller's (tenant, verified user subject, device) push
        token registration. A provider token moving between devices or users
        revokes the previous ACTIVE holder in the same transaction.
      security:
        - tenantGatewayToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PushTokenRegisterRequest'
      responses:
        '201':
          description: Token registered (created or refreshed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
        '400':
          description: Malformed JSON or validation failure
        '401':
          description: Missing/invalid tenant gateway token

  /v1/push-tokens/revoke:
    post:
      summary: Revoke a device push-token registration
      description: >-
        Marks the caller's device registration REVOKED (logout / token
        rollover). Unknown or already-revoked devices fail closed with 404.
      security:
        - tenantGatewayToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [deviceId]
              additionalProperties: false
              properties:
                deviceId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '200':
          description: Token revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PushToken'
        '400':
          description: Malformed JSON or missing deviceId
        '401':
          description: Missing/invalid tenant gateway token
        '404':
          description: Unknown or already-revoked device

components:
  securitySchemes:
    tenantGatewayToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PushTokenRegisterRequest:
      type: object
      required: [deviceId, token, platform]
      additionalProperties: false
      properties:
        deviceId:
          type: string
          minLength: 1
          maxLength: 256
        token:
          type: string
          minLength: 8
          maxLength: 4096
          description: Provider-issued push token (FCM/APNs registration token)
        platform:
          type: string
          enum: [android, ios, web]
    PushToken:
      type: object
      properties:
        userId:
          type: string
          description: Verified gateway subject (never caller-supplied)
        deviceId:
          type: string
        token:
          type: string
        platform:
          type: string
          enum: [android, ios, web]
        status:
          type: string
          enum: [ACTIVE, REVOKED]
        registeredAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        revokedAt:
          type: string
          format: date-time
