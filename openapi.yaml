openapi: 3.1.0
info:
  title: Blue Economy Port Interoperability API
  version: 0.1.0
  description: >-
    Implemented local port-call workflow plus the customs declaration engine
    (/v1/declarations); IMO/NSW partner profiles remain separate acceptance
    gates. The eCallUp booking, slot, gate-scan, call-up queue and NSW ingress
    routes (/v1/bookings, /v1/slots, /v1/terminals, /v1/queue-requests,
    /v1/terminals/{id}/queue, /v1/gate/scans, /v1/nsw/port-calls) are wired and
    tenant-isolated but are documented in README.md until the Ministry
    approves their external interface profile. All /v1 routes require the
    loopback trusted-proxy headers plus a validated HS256 gateway tenant token
    (Authorization: Bearer); the NSW ingress route instead requires an RS256
    authority JWS in X-NSW-Signature.
servers:
  - url: http://localhost:18080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/port-calls:
    post:
      operationId: createPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortCallRequest'
      responses:
        '201':
          description: Created or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortCall'
        '400': {description: Invalid request or missing idempotency key.}
        '401': {description: Missing verified local edge identity.}
        '409': {description: Conflicting idempotency reuse.}
  /v1/port-calls/{call_id}:
    get:
      operationId: getPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      responses:
        '200':
          description: Port call.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortCall'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Port call not found.}
  /v1/port-calls/{call_id}/submit:
    post:
      operationId: submitPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call submitted.}
        '409': {description: Version or state conflict.}
  /v1/port-calls/{call_id}/accept:
    post:
      operationId: acceptPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call accepted.}
        '409': {description: Version or state conflict.}
  /v1/port-calls/{call_id}/reject:
    post:
      operationId: rejectPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call rejected.}
        '409': {description: Version or state conflict.}
  /v1/partner-capabilities:
    get:
      operationId: getPartnerCapabilities
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      responses:
        '200': {description: Source-backed local capabilities.}
        '401': {description: Missing verified edge identity.}
  /v1/port-calls/{call_id}/documents:
    post:
      operationId: declareDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentDeclarationRequest'}}}}
      responses: {'201': {description: Declared document.}, '409': {description: Replay/conflict.}, '422': {description: Invalid workflow.}}
  /v1/port-calls/{call_id}/documents/review:
    post:
      operationId: reviewDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentReviewRequest'}}}}
      responses: {'200': {description: Reviewed document.}, '409': {description: Version/state conflict.}}
  /v1/port-calls/{call_id}/documents/supersede:
    post:
      operationId: supersedeDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentSupersessionRequest'}}}}
      responses: {'201': {description: Immutable supersession evidence recorded.}, '409': {description: Document conflict.}}
  /v1/port-calls/{call_id}/clearance:
    post:
      operationId: decideClearance
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearanceDecisionRequest'}}}}
      responses: {'201': {description: Clearance decision.}, '409': {description: Version/decision conflict.}, '422': {description: Evidence prerequisite unmet.}}
  /v1/port-calls/{call_id}/clearance/amend:
    post:
      operationId: amendClearance
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearanceAmendmentRequest'}}}}
      responses: {'200': {description: Amended clearance.}, '409': {description: Version/actor/decision conflict.}, '422': {description: Invalid amendment.}}
  /v1/declarations:
    post:
      operationId: createDeclaration
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeclarationCreateRequest'}
      responses:
        '201':
          description: Draft declaration created (or exact idempotent replay of request_id).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: Invalid declaration JSON or unknown field.}
        '401': {description: Missing verified local edge identity.}
        '409': {description: Conflicting reuse of request_id with divergent content.}
        '422': {description: Declaration content failed validation.}
    get:
      operationId: listDeclarations
      security: [loopbackTrustedProxy: []]
      description: >-
        Role-scoped list: the caller sees only its own declarations
        (trader_id = verified subject); the optional trader_id filter may
        only name the caller. Out-of-range limit/offset fall back to
        limit=50, offset=0.
      parameters:
        - {$ref: '#/components/parameters/TrustedProxy'}
        - {$ref: '#/components/parameters/AuthenticatedPrincipal'}
        - name: trader_id
          in: query
          required: false
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/DeclarationStatus'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Declarations owned by the caller, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [declarations]
                properties:
                  declarations:
                    type: array
                    items: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified tenant claims.}
        '403': {description: trader_id filter names another principal.}
  /v1/declarations/{declaration_id}:
    get:
      operationId: getDeclaration
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200':
          description: Declaration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
  /v1/declarations/{declaration_id}/clearance-certificate:
    get:
      operationId: getClearanceCertificate
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200':
          description: Clearance certificate and its declaration.
          content:
            application/json:
              schema:
                type: object
                required: [certificate, declaration]
                properties:
                  certificate: {$ref: '#/components/schemas/ClearanceCertificate'}
                  declaration: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Declaration is not in a cleared state.}
  /v1/declarations/{declaration_id}/submit:
    post:
      operationId: submitDeclaration
      description: >-
        DRAFT -> SUBMITTED followed by the fail-closed risk assessment. A
        scorer outage parks the declaration in SCORING_UNAVAILABLE; the
        response always reflects the persisted state.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200':
          description: Declaration after submission and risk assessment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: expected_version must be a positive integer.}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Version or state conflict.}
  /v1/declarations/{declaration_id}/amendments:
    post:
      operationId: amendDeclaration
      description: >-
        Supersedes the live (amendable) revision with a new DRAFT revision
        carrying the amended content.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeclarationAmendmentRequest'}
      responses:
        '201':
          description: New DRAFT revision superseding the amended declaration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: expected_version and the amendment content are required.}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Version conflict or the declaration is not amendable.}
        '422': {description: Amended content failed validation.}
  /v1/tariff-schedules:
    post:
      operationId: registerTariffSchedule
      description: >-
        Registers a versioned, effective-dated tariff schedule (rates as
        DATA, each with a legal anchor) for OFFSHORE_TERMINAL or CRUISE_DUES
        assessments. Schedules are immutable; rate changes are a new
        schedule_id. Requires the port-operator-admin role.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Tariff schedule with rules; registered_by is pinned server-side to the verified caller.}
      responses:
        '201': {description: Schedule registered.}
        '400': {description: Invalid schedule shape.}
        '401': {description: Missing verified local edge identity.}
        '403': {description: port-operator-admin role required.}
        '422': {description: Schedule conflicts with an immutable retained schedule.}
  /v1/offshore-calls:
    post:
      operationId: createOffshoreCall
      description: >-
        Registers a tanker call at an offshore (SBM/SPM/FPSO) terminal with
        its mooring window. Idempotent on the Idempotency-Key header.
        Requires the npa-officer role.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Vessel IMO/name, terminal code/kind, buoy, agency, tonnages, mooring window.}
      responses:
        '201': {description: Offshore call registered (NOMINATED).}
        '400': {description: Invalid request or missing Idempotency-Key.}
        '403': {description: npa-officer role required.}
        '409': {description: Idempotency key conflicts with a retained call.}
  /v1/offshore-calls/{call_id}:
    get:
      operationId: getOffshoreCall
      description: Returns one offshore terminal call.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: The offshore call.}
        '404': {description: Not found.}
  /v1/offshore-calls/{call_id}/transitions:
    post:
      operationId: transitionOffshoreCall
      description: >-
        Advances the mooring-master workflow (NOMINATED → APPROACH_CLEARED →
        MOORED → HOSE_CONNECTED → LOADING → CUSTODY_TRANSFERRED →
        DISCONNECTED → DEPARTED) with optimistic concurrency; the MOORED
        transition names the mooring master. Requires the npa-officer role.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: Transitioned call.}
        '409': {description: Version conflict or invalid transition.}
  /v1/offshore-calls/{call_id}/events:
    post:
      operationId: recordOffshoreEvent
      description: >-
        Appends an operational event (hose connection, loading-arm
        operation, custody-transfer meter reading, mooring note) validated
        against the workflow state. Invalid events are rejected, never
        silently dropped.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Event recorded.}
        '422': {description: Event not valid for the current call state.}
    get:
      operationId: listOffshoreEvents
      description: Returns the append-only operational event trail of a call.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: Operational events in order.}
  /v1/offshore-calls/{call_id}/assessments:
    post:
      operationId: assessOffshoreCall
      description: >-
        Computes the terminal fee against the versioned tariff schedule
        effective at as_of and records the revenue assessment exactly once
        under the idempotency key (signed event to
        finance.revenue-assessments.v1).
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Assessment recorded (or retained on replay).}
        '409': {description: Idempotency key conflicts with a retained assessment.}
        '422': {description: No effective schedule or tariff data gap.}
  /v1/manifests:
    post:
      operationId: ingestPassengerManifest
      description: >-
        Ingests one API/BRI passenger manifest as a signed envelope v1.0
        artifact (FHIR R4 Bundle wrap, JWS-EdDSA over RFC 8785 JCS) from the
        manifest-authority service identity. Per-record validation; every
        unaccepted record lands in the rejection queue with a reason.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, description: Signed envelope v1.0 artifact.}
      responses:
        '201': {description: Manifest accepted in full.}
        '400': {description: Malformed artifact (quarantined with reason).}
        '401': {description: Signature verification failed (quarantined).}
        '403': {description: manifest-authority-agent role required.}
        '409': {description: Envelope id conflicts with a retained manifest.}
        '422': {description: Manifest accepted with record rejections, or rejected.}
  /v1/manifests/{manifest_id}:
    get:
      operationId: getPassengerManifest
      description: Returns the ingest outcome of one manifest.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: The recorded manifest.}
        '404': {description: Not found.}
  /v1/manifest-rejections:
    get:
      operationId: listManifestRejections
      description: >-
        Reads the rejection queue (per-record reasons and envelope-level
        quarantine entries); optional manifest_id query filter.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: Rejection queue entries.}
  /v1/cruise-calls:
    post:
      operationId: createCruiseCall
      description: >-
        Registers a cruise call extending an existing platform port call
        with passenger count (band derived deterministically). Idempotent on
        the Idempotency-Key header. Requires the npa-officer role.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Cruise call registered (PLANNED).}
        '404': {description: Referenced port call not found.}
        '409': {description: Idempotency key conflict.}
  /v1/cruise-calls/{call_id}:
    get:
      operationId: getCruiseCall
      description: Returns one cruise call.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: The cruise call.}
        '404': {description: Not found.}
  /v1/cruise-calls/{call_id}/transitions:
    post:
      operationId: transitionCruiseCall
      description: Advances PLANNED → CONFIRMED → ARRIVED → COMPLETED (CANCELLED before arrival) with optimistic concurrency.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: Transitioned call.}
        '409': {description: Version conflict or invalid transition.}
  /v1/cruise-calls/{call_id}/pax-count:
    post:
      operationId: updateCruisePaxCount
      description: >-
        Records the final-manifest passenger count (band recomputed);
        pre-arrival dues assessments are never mutated — recomputation is a
        new assessment under a new idempotency key.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200': {description: Updated call.}
        '409': {description: Version conflict or call closed.}
  /v1/cruise-calls/{call_id}/excursions:
    post:
      operationId: addCruiseExcursion
      description: Registers an excursion manifest (idempotent).
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Excursion registered.}
        '409': {description: Idempotency key conflict.}
  /v1/cruise-calls/{call_id}/tender-allocations:
    post:
      operationId: allocateCruiseTender
      description: >-
        Reserves a tender terminal/berth window; overlapping windows on the
        same berth are rejected (one berth serves one call at a time).
        Requires the port-operator-admin role.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Allocation recorded.}
        '403': {description: port-operator-admin role required.}
        '422': {description: Overlapping berth window or invalid allocation.}
  /v1/cruise-calls/{call_id}/dues-assessments:
    post:
      operationId: assessCruiseDues
      description: >-
        Computes cruise dues (per-passenger charges) against the versioned
        CRUISE_DUES schedule effective at as_of; recorded exactly once under
        the idempotency key (signed event to finance.revenue-assessments.v1).
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '201': {description: Assessment recorded (or retained on replay).}
        '409': {description: Idempotency key conflicts with a retained assessment.}
        '422': {description: No effective schedule or tariff data gap.}
components:
  securitySchemes:
    loopbackTrustedProxy:
      type: apiKey
      in: header
      name: X-Authenticated-Principal
      description: Local-only boundary; production requires a verified Ministry OIDC/API-edge profile.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    TrustedProxy:
      name: X-Trusted-Proxy
      in: header
      required: true
      schema: {type: string, const: loopback}
    AuthenticatedPrincipal:
      name: X-Authenticated-Principal
      in: header
      required: true
      schema: {type: string, minLength: 1}
    CallID:
      name: call_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DeclarationID:
      name: declaration_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  schemas:
    CreatePortCallRequest:
      type: object
      additionalProperties: false
      required: [call_id, vessel_imo, port_code, declaration_reference, submitted_by]
      properties:
        call_id: {type: string, minLength: 1, maxLength: 256}
        vessel_imo: {type: string, pattern: '^[0-9]{7}$'}
        port_code: {type: string, pattern: '^[A-Z]{2,8}$'}
        declaration_reference: {type: string, minLength: 1, maxLength: 256}
        submitted_by: {type: string, minLength: 1, maxLength: 256}
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    DocumentDeclarationRequest:
      type: object
      additionalProperties: false
      required: [document_type, media_type, size_bytes, sha256, declared_by]
      properties:
        document_type: {type: string, pattern: '^[A-Za-z][A-Za-z0-9._:-]{0,63}$'}
        media_type: {type: string, pattern: '^[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+$'}
        size_bytes: {type: integer, minimum: 1, maximum: 104857600}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        declared_by: {type: string, minLength: 1, maxLength: 256}
    DocumentReviewRequest:
      type: object
      additionalProperties: false
      required: [document_id, expected_version, status, reviewed_by, reason]
      properties:
        document_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
        status: {type: string, enum: [VERIFIED, REJECTED]}
        reviewed_by: {type: string, minLength: 1, maxLength: 256}
        reason: {type: string, minLength: 1, maxLength: 1024}
    DocumentSupersessionRequest:
      type: object
      additionalProperties: false
      required: [original_document_id, replacement_document_id, reason, superseded_by]
      properties:
        original_document_id: {type: string, format: uuid}
        replacement_document_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 1024}
