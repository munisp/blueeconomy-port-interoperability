openapi: 3.1.0
info:
  title: Blue Economy Port Interoperability API
  version: 0.1.0
  description: >-
    Implemented local port-call workflow plus the customs declaration engine
    (/v1/declarations); IMO/NSW partner profiles remain separate acceptance
    gates. The eCallUp booking, slot, gate-scan, call-up queue and NSW ingress
    routes (/v1/bookings, /v1/slots, /v1/terminals, /v1/queue-requests,
    /v1/terminals/{id}/queue, /v1/gate/scans, /v1/nsw/port-calls) are wired and
    tenant-isolated but are documented in README.md until the Ministry
    approves their external interface profile. All /v1 routes require the
    loopback trusted-proxy headers plus a validated HS256 gateway tenant token
    (Authorization: Bearer); the NSW ingress route instead requires an RS256
    authority JWS in X-NSW-Signature.
servers:
  - url: http://localhost:18080
paths:
  /healthz:
    get:
      operationId: health
      responses:
        '200':
          description: Service is alive.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
  /v1/port-calls:
    post:
      operationId: createPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePortCallRequest'
      responses:
        '201':
          description: Created or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortCall'
        '400': {description: Invalid request or missing idempotency key.}
        '401': {description: Missing verified local edge identity.}
        '409': {description: Conflicting idempotency reuse.}
  /v1/port-calls/{call_id}:
    get:
      operationId: getPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      responses:
        '200':
          description: Port call.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PortCall'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Port call not found.}
  /v1/port-calls/{call_id}/submit:
    post:
      operationId: submitPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call submitted.}
        '409': {description: Version or state conflict.}
  /v1/port-calls/{call_id}/accept:
    post:
      operationId: acceptPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call accepted.}
        '409': {description: Version or state conflict.}
  /v1/port-calls/{call_id}/reject:
    post:
      operationId: rejectPortCall
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/CallID'
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200': {description: Port call rejected.}
        '409': {description: Version or state conflict.}
  /v1/partner-capabilities:
    get:
      operationId: getPartnerCapabilities
      security: [loopbackTrustedProxy: []]
      parameters:
        - $ref: '#/components/parameters/TrustedProxy'
        - $ref: '#/components/parameters/AuthenticatedPrincipal'
      responses:
        '200': {description: Source-backed local capabilities.}
        '401': {description: Missing verified edge identity.}
  /v1/port-calls/{call_id}/documents:
    post:
      operationId: declareDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentDeclarationRequest'}}}}
      responses: {'201': {description: Declared document.}, '409': {description: Replay/conflict.}, '422': {description: Invalid workflow.}}
  /v1/port-calls/{call_id}/documents/review:
    post:
      operationId: reviewDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentReviewRequest'}}}}
      responses: {'200': {description: Reviewed document.}, '409': {description: Version/state conflict.}}
  /v1/port-calls/{call_id}/documents/supersede:
    post:
      operationId: supersedeDocument
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/DocumentSupersessionRequest'}}}}
      responses: {'201': {description: Immutable supersession evidence recorded.}, '409': {description: Document conflict.}}
  /v1/port-calls/{call_id}/clearance:
    post:
      operationId: decideClearance
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearanceDecisionRequest'}}}}
      responses: {'201': {description: Clearance decision.}, '409': {description: Version/decision conflict.}, '422': {description: Evidence prerequisite unmet.}}
  /v1/port-calls/{call_id}/clearance/amend:
    post:
      operationId: amendClearance
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/CallID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ClearanceAmendmentRequest'}}}}
      responses: {'200': {description: Amended clearance.}, '409': {description: Version/actor/decision conflict.}, '422': {description: Invalid amendment.}}
  /v1/declarations:
    post:
      operationId: createDeclaration
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeclarationCreateRequest'}
      responses:
        '201':
          description: Draft declaration created (or exact idempotent replay of request_id).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: Invalid declaration JSON or unknown field.}
        '401': {description: Missing verified local edge identity.}
        '409': {description: Conflicting reuse of request_id with divergent content.}
        '422': {description: Declaration content failed validation.}
    get:
      operationId: listDeclarations
      security: [loopbackTrustedProxy: []]
      description: >-
        Role-scoped list: the caller sees only its own declarations
        (trader_id = verified subject); the optional trader_id filter may
        only name the caller. Out-of-range limit/offset fall back to
        limit=50, offset=0.
      parameters:
        - {$ref: '#/components/parameters/TrustedProxy'}
        - {$ref: '#/components/parameters/AuthenticatedPrincipal'}
        - name: trader_id
          in: query
          required: false
          schema: {type: string}
        - name: status
          in: query
          required: false
          schema: {$ref: '#/components/schemas/DeclarationStatus'}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
        - name: offset
          in: query
          required: false
          schema: {type: integer, minimum: 0, default: 0}
      responses:
        '200':
          description: Declarations owned by the caller, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [declarations]
                properties:
                  declarations:
                    type: array
                    items: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified tenant claims.}
        '403': {description: trader_id filter names another principal.}
  /v1/declarations/{declaration_id}:
    get:
      operationId: getDeclaration
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200':
          description: Declaration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
  /v1/declarations/{declaration_id}/clearance-certificate:
    get:
      operationId: getClearanceCertificate
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      responses:
        '200':
          description: Clearance certificate and its declaration.
          content:
            application/json:
              schema:
                type: object
                required: [certificate, declaration]
                properties:
                  certificate: {$ref: '#/components/schemas/ClearanceCertificate'}
                  declaration: {$ref: '#/components/schemas/Declaration'}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Declaration is not in a cleared state.}
  /v1/declarations/{declaration_id}/submit:
    post:
      operationId: submitDeclaration
      description: >-
        DRAFT -> SUBMITTED followed by the fail-closed risk assessment. A
        scorer outage parks the declaration in SCORING_UNAVAILABLE; the
        response always reflects the persisted state.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransitionRequest'}
      responses:
        '200':
          description: Declaration after submission and risk assessment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: expected_version must be a positive integer.}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Version or state conflict.}
  /v1/declarations/{declaration_id}/amendments:
    post:
      operationId: amendDeclaration
      description: >-
        Supersedes the live (amendable) revision with a new DRAFT revision
        carrying the amended content.
      security: [loopbackTrustedProxy: []]
      parameters: [{$ref: '#/components/parameters/DeclarationID'}, {$ref: '#/components/parameters/TrustedProxy'}, {$ref: '#/components/parameters/AuthenticatedPrincipal'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeclarationAmendmentRequest'}
      responses:
        '201':
          description: New DRAFT revision superseding the amended declaration.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Declaration'}
        '400': {description: expected_version and the amendment content are required.}
        '401': {description: Missing verified local edge identity.}
        '404': {description: Declaration not found.}
        '409': {description: Version conflict or the declaration is not amendable.}
        '422': {description: Amended content failed validation.}
components:
  securitySchemes:
    loopbackTrustedProxy:
      type: apiKey
      in: header
      name: X-Authenticated-Principal
      description: Local-only boundary; production requires a verified Ministry OIDC/API-edge profile.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    TrustedProxy:
      name: X-Trusted-Proxy
      in: header
      required: true
      schema: {type: string, const: loopback}
    AuthenticatedPrincipal:
      name: X-Authenticated-Principal
      in: header
      required: true
      schema: {type: string, minLength: 1}
    CallID:
      name: call_id
      in: path
      required: true
      schema: {type: string, minLength: 1, maxLength: 256}
    DeclarationID:
      name: declaration_id
      in: path
      required: true
      schema: {type: string, minLength: 1}
  schemas:
    CreatePortCallRequest:
      type: object
      additionalProperties: false
      required: [call_id, vessel_imo, port_code, declaration_reference, submitted_by]
      properties:
        call_id: {type: string, minLength: 1, maxLength: 256}
        vessel_imo: {type: string, pattern: '^[0-9]{7}$'}
        port_code: {type: string, pattern: '^[A-Z]{2,8}$'}
        declaration_reference: {type: string, minLength: 1, maxLength: 256}
        submitted_by: {type: string, minLength: 1, maxLength: 256}
    TransitionRequest:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 1}
    DocumentDeclarationRequest:
      type: object
      additionalProperties: false
      required: [document_type, media_type, size_bytes, sha256, declared_by]
      properties:
        document_type: {type: string, pattern: '^[A-Za-z][A-Za-z0-9._:-]{0,63}$'}
        media_type: {type: string, pattern: '^[A-Za-z0-9.+-]+/[A-Za-z0-9.+-]+$'}
        size_bytes: {type: integer, minimum: 1, maximum: 104857600}
        sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        declared_by: {type: string, minLength: 1, maxLength: 256}
    DocumentReviewRequest:
      type: object
      additionalProperties: false
      required: [document_id, expected_version, status, reviewed_by, reason]
      properties:
        document_id: {type: string, format: uuid}
        expected_version: {type: integer, minimum: 1}
        status: {type: string, enum: [VERIFIED, REJECTED]}
        reviewed_by: {type: string, minLength: 1, maxLength: 256}
        reason: {type: string, minLength: 1, maxLength: 1024}
    DocumentSupersessionRequest:
      type: object
      additionalProperties: false
      required: [original_document_id, replacement_document_id, reason, superseded_by]
      properties:
        original_document_id: {type: string, format: uuid}
        replacement_document_id: {type: string, format: uuid}
        reason: {type: string, minLength: 1, maxLength: 1024}
        superseded_by: {type: string, minLength: 1, maxLength: 256}
    ClearanceDecisionRequest:
      type: object
      additionalProperties: false
      required: [expected_version, decision, reason, decided_by]
      properties:
        expected_version: {type: integer, minimum: 1}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string, minLength: 1, maxLength: 1024}
        decided_by: {type: string, minLength: 1, maxLength: 256}
    ClearanceAmendmentRequest:
      type: object
      additionalProperties: false
      required: [expected_version, decision, reason, amended_by]
      properties:
        expected_version: {type: integer, minimum: 1}
        decision: {type: string, enum: [APPROVED, REJECTED]}
        reason: {type: string, minLength: 1, maxLength: 1024}
        amended_by: {type: string, minLength: 1, maxLength: 256}
    PortCall:
      type: object
      required: [call_id, vessel_imo, port_code, declaration_reference, submitted_by, status, created_at, updated_at, version]
      properties:
        call_id: {type: string}
        vessel_imo: {type: string}
        port_code: {type: string}
        declaration_reference: {type: string}
        submitted_by: {type: string}
        status: {type: string, enum: [DRAFT, SUBMITTED, ACCEPTED, REJECTED]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    DeclarationStatus:
      type: string
      enum: [DRAFT, SUBMITTED, RISK_ASSESSED, GREEN_LANE, YELLOW_LANE, RED_LANE, CLEARED, REJECTED, SCORING_UNAVAILABLE, SUPERSEDED]
    DeclarationType:
      type: string
      enum: [IMPORT, EXPORT, TRANSIT, RE_EXPORT, TEMPORARY_IMPORT]
    RiskLane:
      type: string
      enum: [GREEN, YELLOW, RED]
    DeclarationCreateRequest:
      type: object
      additionalProperties: false
      description: >-
        All money amounts are integer minor units of invoice_currency. Duty
        rates are basis points (0-10000).
      required: [request_id, declaration_ref, declaration_type, hs_code, goods_description, country_of_origin, port_of_entry, gross_weight_kg, net_weight_kg, number_of_packages, consignee_id, operator_id, invoice_amount_minor, invoice_currency, tariff_bps, vat_bps]
      properties:
        request_id: {type: string, minLength: 8, maxLength: 128, description: Idempotency key for the create.}
        declaration_ref: {type: string, pattern: '^[A-Z0-9][A-Z0-9/-]{3,63}$'}
        ucr: {type: string, minLength: 8, maxLength: 64}
        declaration_type: {$ref: '#/components/schemas/DeclarationType'}
        hs_code: {type: string, description: WCO HS code; normalized at ingestion.}
        goods_description: {type: string, minLength: 10, maxLength: 4096}
        country_of_origin: {type: string, pattern: '^[A-Z]{2}$'}
        country_of_destination: {type: string, pattern: '^[A-Z]{2}$'}
        port_of_entry: {type: string, minLength: 2, maxLength: 64}
        gross_weight_kg: {type: integer, minimum: 1}
        net_weight_kg: {type: integer, minimum: 1, description: Must not exceed gross_weight_kg.}
        number_of_packages: {type: integer, minimum: 1}
        consignee_id: {type: string, minLength: 2, maxLength: 128}
        operator_id: {type: string, minLength: 2, maxLength: 128}
        is_aeo: {type: boolean}
        invoice_amount_minor: {type: integer, minimum: 1}
        freight_amount_minor: {type: integer, minimum: 0}
        insurance_amount_minor: {type: integer, minimum: 0}
        invoice_currency: {type: string, pattern: '^[A-Z]{3}$'}
        tariff_bps: {type: integer, minimum: 0, maximum: 10000}
        vat_bps: {type: integer, minimum: 0, maximum: 10000}
        levy_bps: {type: integer, minimum: 0, maximum: 10000}
        excise_bps: {type: integer, minimum: 0, maximum: 10000}
    DeclarationAmendmentRequest:
      allOf:
        - $ref: '#/components/schemas/DeclarationCreateRequest'
        - type: object
          additionalProperties: false
          required: [expected_version]
          properties:
            expected_version: {type: integer, minimum: 1, description: Version of the live revision being amended.}
    Declaration:
      type: object
      required: [declaration_id, tenant_id, request_id, declaration_ref, revision, trader_id, declaration_type, status, hs_code, goods_description, country_of_origin, port_of_entry, gross_weight_kg, net_weight_kg, number_of_packages, consignee_id, operator_id, is_aeo, invoice_amount_minor, freight_amount_minor, insurance_amount_minor, invoice_currency, tariff_bps, vat_bps, levy_bps, excise_bps, created_at, updated_at, version]
      properties:
        declaration_id: {type: string}
        tenant_id: {type: string}
        request_id: {type: string}
        declaration_ref: {type: string}
        ucr: {type: string}
        revision: {type: integer, minimum: 1}
        supersedes_id: {type: string}
        trader_id: {type: string}
        declaration_type: {$ref: '#/components/schemas/DeclarationType'}
        status: {$ref: '#/components/schemas/DeclarationStatus'}
        risk_lane: {$ref: '#/components/schemas/RiskLane'}
        risk_score: {type: integer}
        scoring_model: {type: string}
        scoring_error: {type: string}
        hs_code: {type: string}
        goods_description: {type: string}
        country_of_origin: {type: string}
        country_of_destination: {type: string}
        port_of_entry: {type: string}
        gross_weight_kg: {type: integer}
        net_weight_kg: {type: integer}
        number_of_packages: {type: integer}
        consignee_id: {type: string}
        operator_id: {type: string}
        is_aeo: {type: boolean}
        invoice_amount_minor: {type: integer, description: Integer minor units.}
        freight_amount_minor: {type: integer, description: Integer minor units.}
        insurance_amount_minor: {type: integer, description: Integer minor units.}
        invoice_currency: {type: string}
        tariff_bps: {type: integer}
        vat_bps: {type: integer}
        levy_bps: {type: integer}
        excise_bps: {type: integer}
        duty_minor: {type: integer, description: Integer minor units.}
        vat_minor: {type: integer, description: Integer minor units.}
        levy_minor: {type: integer, description: Integer minor units.}
        excise_minor: {type: integer, description: Integer minor units.}
        total_duty_minor: {type: integer, description: Integer minor units.}
        rejection_reason: {type: string}
        submitted_at: {type: string, format: date-time}
        cleared_at: {type: string, format: date-time}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {type: integer, minimum: 1}
    ClearanceCertificate:
      type: object
      required: [certificate_id, declaration_id, certificate_number, issued_by, payload_sha256, issued_at]
      properties:
        certificate_id: {type: string}
        declaration_id: {type: string}
        certificate_number: {type: string}
        issued_by: {type: string}
        payload_sha256: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        issued_at: {type: string, format: date-time}
