name: Live Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  postgres-gated-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.4@sha256:e62fbf9d3e2b49816a32c400ed2dba83e3b361e6833e624024309c35d334b412
        env:
          POSTGRES_DB: blueeconomy_port
          POSTGRES_USER: blueeconomy
          POSTGRES_PASSWORD: local-only-integration-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blueeconomy -d blueeconomy_port"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create the dedicated queue test database
        # The queue package resets the public schema per test; a dedicated
        # database keeps it race-safe against the booking package reset when
        # `go test` runs packages in parallel.
        env:
          PGPASSWORD: local-only-integration-password
        run: psql -h 127.0.0.1 -U blueeconomy -d blueeconomy_port -c 'CREATE DATABASE blueeconomy_queue'
      - name: Run booking and queue store tests against live PostgreSQL
        env:
          BOOKING_TEST_DATABASE_URL: postgres://blueeconomy:local-only-integration-password@127.0.0.1:5432/blueeconomy_port?sslmode=disable
          QUEUE_TEST_DATABASE_URL: postgres://blueeconomy:local-only-integration-password@127.0.0.1:5432/blueeconomy_queue?sslmode=disable
        run: go test -race -count=1 ./internal/booking/... ./internal/queue/...
      - name: Capture PostgreSQL service logs on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p integration-logs
          docker ps -a > integration-logs/docker-ps.txt 2>&1 || true
          for container in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$container" | tr -d '/')
            docker logs "$container" > "integration-logs/${name}.log" 2>&1 || true
          done
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: postgres-gated-test-logs
          path: integration-logs/
          if-no-files-found: error
          retention-days: 14

  e2e-verify-local:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run the end-to-end verification script
        # Starts pinned PostgreSQL via docker-compose.integration.yml, builds
        # and boots the real server, then verifies the tenant-wired port-call
        # flow, booking state machine, slot capacity, gate denial and outbox
        # atomicity over HTTP.
        run: scripts/verify-local.sh
      - name: Capture server and service logs on failure
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p integration-logs
          cp .integration-server.log integration-logs/server.log 2>/dev/null || true
          docker ps -a > integration-logs/docker-ps.txt 2>&1 || true
          for container in $(docker ps -aq); do
            name=$(docker inspect --format '{{.Name}}' "$container" | tr -d '/')
            docker logs "$container" > "integration-logs/${name}.log" 2>&1 || true
          done
      - name: Upload integration logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-verify-local-logs
          path: integration-logs/
          if-no-files-found: error
          retention-days: 14
